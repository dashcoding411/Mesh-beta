<!doctype html>
<!--
  The iPhone app icon (1024px, square, no transparency: iOS rounds the corners).
  ?size=2732&splash=1 renders the launch screen instead. Regenerate with
  scripts/app-assets.sh after editing.
-->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; overflow: hidden; background: #09090b; }
  body { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  .tile { display: flex; align-items: center; justify-content: center; }
</style></head>
<body>
  <div class="tile" id="tile">
    <svg id="mark" viewBox="10 10 44 44" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#a78bfa"/>
          <stop offset="1" stop-color="#e879f9"/>
        </linearGradient>
      </defs>
      <g stroke="url(#g)" stroke-width="3.5" stroke-linecap="round" fill="none">
        <path d="M14 20h36M14 32h36M14 44h36"/>
        <path d="M20 14v36M32 14v36M44 14v36"/>
      </g>
    </svg>
  </div>
  <script>
    // Icon: the mark fills ~62% of the square. Launch screen: a small mark in the middle.
    const splash = new URLSearchParams(location.search).has("splash");
    const side = Math.min(innerWidth, innerHeight);
    const mark = document.getElementById("mark");
    const size = Math.round(side * (splash ? 0.14 : 0.62));
    mark.setAttribute("width", size);
    mark.setAttribute("height", size);
  </script>
</body></html>
