<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mesh: Let's mesh together again</title>
    <meta name="description" content="Mesh is a social network for posts, short and long video, communities and news that has to cite its sources. Ads never target what you do, and no data is sold." />
    <!-- Google AdSense ownership check. Loads nothing; the ad script itself is never loaded without consent. -->
    <meta name="google-adsense-account" content="ca-pub-5587358450230709" />
    <link rel="canonical" href="https://joinmesh.social/" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" type="image/svg+xml" href="/mesh.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- How a shared link looks in Messages, WhatsApp, Facebook, X and Slack. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mesh" />
    <meta property="og:title" content="Mesh: Let's mesh together again" />
    <meta property="og:description" content="Posts, short and long video, communities and news that has to cite its sources. Ads never target what you do, and no data is sold." />
    <meta property="og:url" content="https://joinmesh.social/" />
    <meta property="og:image" content="https://joinmesh.social/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Mesh logo and the words Let's mesh together again." />
    <meta property="og:locale" content="en_AU" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Mesh",
        "alternateName": "Let's mesh together again",
        "url": "https://joinmesh.social/",
        "inLanguage": "en-AU"
      }
    </script>
  </head>
  <body class="bg-canvas text-fg">
    <!-- What arrives before the app starts, for search engines, link
         previewers and anyone without JavaScript. React replaces it. -->
    <div id="root">
      <main class="mx-auto flex min-h-dvh max-w-xl flex-col justify-center px-6 py-16">
        <p class="font-display text-title-2 font-extrabold">Mesh</p>
        <h1 class="mt-6 font-display text-display font-extrabold leading-tight">Let's mesh together again.</h1>
        <p class="mt-4 text-body text-fg-muted">
          A social network for posts, short and long video, communities and news that has to cite its sources.
          Ads never target what you do, and no data is sold.
        </p>
        <noscript>
          <p class="mt-6 text-body">Mesh needs JavaScript switched on to sign in and use it.</p>
        </noscript>
        <nav aria-label="Policies" class="mt-10 flex flex-wrap gap-x-5 gap-y-2 text-callout text-fg-muted">
          <a href="/legal/privacy">Privacy Policy</a>
          <a href="/legal/terms">Terms of Service</a>
          <a href="/legal/guidelines">Community Guidelines</a>
          <a href="/legal/cookies">Cookies &amp; Storage</a>
        </nav>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
